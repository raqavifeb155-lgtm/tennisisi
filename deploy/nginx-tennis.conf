# Static hosting for the web build (Telegram Mini App). __DOMAIN__ is filled in by deploy.sh.
server {
	listen 80;
	listen [::]:80;
	server_name __DOMAIN__;

	root /var/www/tennis;
	index index.html;

	gzip on;
	gzip_static on;   # the archive ships index.wasm.gz etc.: no compressing on every request
	gzip_comp_level 6;
	gzip_types application/wasm application/javascript text/javascript text/css application/octet-stream;

	# Always revalidate, so a new version reaches players right away (ETag makes repeat loads cheap).
	add_header Cache-Control "no-cache" always;

	location ~ \.wasm$ {
		types { }
		default_type application/wasm;
		add_header Cache-Control "no-cache" always;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
